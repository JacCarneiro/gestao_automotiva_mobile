<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Veículos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meus Veículos</title>
<style>
html,body{margin:0;height:100%;background:#0B3F4A;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4F3EF}
#aviso{display:none;color:#fff;padding:32px;line-height:1.5}
</style>
</head>
<body>
<div id="aviso"></div>
<iframe id="app" title="Meus Veículos"></iframe>
<script>
// >>> COLE AQUI o endereço do app da web (termina em /exec) <<<
var APP_URL = 'COLE_AQUI_O_ENDERECO_DO_APP/exec';

if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
  document.getElementById('app').style.display = 'none';
  var a = document.getElementById('aviso');
  a.style.display = 'block';
  a.innerHTML = '<h2>Falta configurar</h2><p>Abra o arquivo <b>index.html</b> desta pasta e troque o valor de <b>APP_URL</b> pelo endereço do seu app (o que termina em /exec).</p>';
} else {
  document.getElementById('app').src = APP_URL;
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
